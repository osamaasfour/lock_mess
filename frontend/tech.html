<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>Lock-Ops · My jobs</title>
    <link rel="stylesheet" href="assets/app.css">
    <style>
        body { padding-bottom: env(safe-area-inset-bottom); }
        .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
        .hello { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; }
        .hello h1 { font-size: 20px; font-weight: 900; }
        .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .seg button { padding: 12px 6px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--soft); font: inherit; font-weight: 700; cursor: pointer; }
        .seg button.on[data-s=available] { background: #065f46; border-color: #10b981; color: #fff; }
        .seg button.on[data-s=busy] { background: #78350f; border-color: #f59e0b; color: #fff; }
        .seg button.on[data-s=off] { background: #3f3f46; border-color: #a1a1aa; color: #fff; }
        .card + .card { margin-top: 14px; }
        .gps-state { font-weight: 700; }
        .gps-on { color: #34d399; } .gps-off { color: var(--muted); } .gps-err { color: #fca5a5; }
        .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .switch input { width: 52px; height: 30px; appearance: none; background: #3f3f46; border-radius: 999px; position: relative; cursor: pointer; border: 0; padding: 0; flex: none; }
        .switch input::after { content: ''; position: absolute; width: 24px; height: 24px; border-radius: 50%; background: #fff; top: 3px; left: 3px; transition: .15s; }
        .switch input:checked { background: var(--ok-2); }
        .switch input:checked::after { left: 25px; }
        .job { border: 1px solid var(--line-2); border-radius: 10px; padding: 14px; margin-top: 12px; background: var(--panel-2); }
        .job .addr { font-size: 16px; font-weight: 700; color: #fff; margin: 6px 0; }
        .job .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
        .job .actions .btn { padding: 12px 8px; }
        .big { font-size: 16px; padding: 14px; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="hello"><h1 id="hello">My jobs</h1><span class="spacer"></span>
            <button class="btn btn-sm" id="logout" type="button">Log out</button></div>
        <div id="banner" class="hidden"></div>

        <div class="card">
            <span class="label">My status</span>
            <div class="seg" id="status">
                <button type="button" data-s="available">Available</button>
                <button type="button" data-s="busy">Busy</button>
                <button type="button" data-s="off">Off duty</button>
            </div>
        </div>

        <div class="card">
            <label class="switch"><span><b>Share my live location</b><br><span class="small muted">So dispatch can send you the nearest jobs.</span></span>
                <input type="checkbox" id="gps-toggle" role="switch"></label>
            <p class="small" style="margin:10px 0 0"><span class="gps-state gps-off" id="gps-state">Off</span> <span class="muted" id="gps-detail"></span></p>
            <p class="small muted" style="margin:8px 0 0">Keep this page open while working. Phones pause location when the screen locks or you switch apps; it resumes when you come back.</p>
        </div>

        <div class="card">
            <div class="card-head"><h2>Assigned jobs</h2><span class="spacer"></span><button class="btn btn-sm" id="refresh" type="button">↻</button></div>
            <div id="jobs"><div class="muted">Loading…</div></div>
        </div>
    </div>

    <script src="assets/app.js"></script>
    <script>
    (async function () {
        const { api, toast, banner, $, esc, ago, store } = LockOps;
        const user = await LockOps.requireAuth(['technician']);
        $('#hello').textContent = `Hi, ${user.name.split(' ')[0]}`;
        $('#logout').onclick = () => { stopGps(); LockOps.logout(false); };

        let me = null;

        // ---------------- status ----------------
        function renderStatus() {
            document.querySelectorAll('#status button').forEach(b => b.classList.toggle('on', b.dataset.s === me?.status));
        }
        $('#status').addEventListener('click', async e => {
            const s = e.target.closest('button')?.dataset.s;
            if (!s) return;
            try { me = (await api('/api/me/status', { method: 'PUT', body: { status: s } })).technician; renderStatus(); toast(`Status: ${s}`); }
            catch (err) { toast(err.message, 'error'); }
        });

        // ---------------- live GPS ----------------
        let watchId = null, last = null, lastSentAt = 0, wakeLock = null;
        const MIN_MOVE_M = 50, MAX_QUIET_MS = 60000;

        function metres(a, b) {
            const R = 6371000, rad = d => d * Math.PI / 180;
            const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lng - a.lng) / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(h));
        }
        function setGps(state, cls, detail = '') { $('#gps-state').textContent = state; $('#gps-state').className = `gps-state ${cls}`; $('#gps-detail').textContent = detail; }

        async function send(pos) {
            const p = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
            const moved = !last || metres(last, p) >= MIN_MOVE_M;
            if (!moved && Date.now() - lastSentAt < MAX_QUIET_MS) return;
            try {
                await api('/api/me/location', { method: 'POST', body: p });
                last = p; lastSentAt = Date.now();
                setGps('Sharing', 'gps-on', `· updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} · ±${Math.round(p.accuracy)} m`);
            } catch (err) { setGps('Sharing (retrying)', 'gps-err', `· ${err.message}`); }
        }

        async function startGps() {
            if (!('geolocation' in navigator)) { setGps('Not supported', 'gps-err', 'This browser has no GPS access.'); $('#gps-toggle').checked = false; return; }
            setGps('Starting…', 'gps-off', '· allow location access if your phone asks');
            watchId = navigator.geolocation.watchPosition(send, err => {
                const msg = err.code === 1 ? 'Location permission was denied. Allow it in your browser settings for this site.' : err.message;
                setGps('Not sharing', 'gps-err', `· ${msg}`);
                if (err.code === 1) { $('#gps-toggle').checked = false; stopGps(); store.set('lockops.gps', null); }
            }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
            // Ask the phone to keep the screen on while sharing (supported on most modern browsers).
            try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
            store.set('lockops.gps', '1');
        }
        function stopGps() {
            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            watchId = null;
            try { wakeLock?.release(); } catch {}
            wakeLock = null;
            setGps('Off', 'gps-off', '');
        }
        // A quiet heartbeat re-sends the last position so the dashboard knows we're still here.
        setInterval(() => { if (watchId !== null) navigator.geolocation.getCurrentPosition(send, () => {}, { maximumAge: 30000, timeout: 20000 }); }, MAX_QUIET_MS);
        document.addEventListener('visibilitychange', async () => {
            if (!document.hidden && watchId !== null) { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch {} }
        });
        $('#gps-toggle').onchange = e => { if (e.target.checked) startGps(); else { stopGps(); store.set('lockops.gps', null); } };

        // ---------------- jobs ----------------
        async function loadJobs() {
            try {
                const r = await api('/api/me/jobs');
                me = r.technician; renderStatus();
                $('#jobs').innerHTML = r.jobs.length ? r.jobs.map(j => `
                    <div class="job">
                        <div class="row"><span class="badge st-${esc(j.status.split(' ')[0])}">${esc(j.status)}</span><span class="mono small">#${esc(j.id)}</span><span class="spacer"></span><span class="small muted">${ago(j.assignedAt)}</span></div>
                        <div class="addr">${esc(j.address || 'Location on map')}</div>
                        <div>${esc(j.issue || '')}</div>
                        <div class="small muted" style="margin-top:6px">${esc(j.client?.name || '')}${j.client?.phone ? ` · ${esc(j.client.phone)}` : ''}</div>
                        <div class="actions">
                            <a class="btn btn-primary" href="${esc(j.directionsUrl)}" target="_blank" rel="noopener">🧭 Directions</a>
                            ${j.client?.phone ? `<a class="btn" href="tel:${esc(j.client.phone)}">📞 Call client</a>` : '<span></span>'}
                            ${j.status === 'Assigned' ? `<button type="button" class="btn" data-job="${esc(j.id)}" data-s="En route">🚗 On my way</button>` : '<span></span>'}
                            ${j.status !== 'Completed' ? `<button type="button" class="btn btn-ok" data-job="${esc(j.id)}" data-s="Completed">✅ Job done</button>` : '<span class="small muted" style="align-self:center">Waiting for dispatch to close</span>'}
                        </div>
                    </div>`).join('') : '<div class="muted">No jobs assigned right now. New jobs also arrive by message.</div>';
                banner($('#banner'), '');
            } catch (err) { if (err.status !== 401) banner($('#banner'), esc(err.message)); }
        }
        $('#jobs').addEventListener('click', async e => {
            const b = e.target.closest('[data-job]');
            if (!b) return;
            if (b.dataset.s === 'Completed' && !confirm('Mark this job as done?')) return;
            b.disabled = true;
            try { await api(`/api/me/jobs/${b.dataset.job}/status`, { method: 'POST', body: { status: b.dataset.s } }); toast(b.dataset.s === 'Completed' ? 'Marked done. Dispatch will close it.' : 'Dispatch knows you’re on the way.'); await loadJobs(); }
            catch (err) { toast(err.message, 'error'); b.disabled = false; }
        });
        $('#refresh').onclick = loadJobs;

        await loadJobs();
        if (store.get('lockops.gps')) { $('#gps-toggle').checked = true; startGps(); }
        setInterval(() => { if (!document.hidden) loadJobs(); }, 30000);
    })();
    </script>
</body>
</html>
